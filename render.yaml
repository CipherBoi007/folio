services:
  - type: web
    name: folio-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FOLIO_DEMO_DATA
        value: "true"
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
