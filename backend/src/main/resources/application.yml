spring:
  application:
    name: folio-api
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  task:
    scheduling:
      pool:
        size: 1

server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/csv
  error:
    include-stacktrace: never
    include-message: never
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: Folio
    description: Library operations console

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

folio:
  demo-data: ${FOLIO_DEMO_DATA:true}
  time-zone: ${APP_TIME_ZONE:Asia/Kolkata}
  auth:
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: folio-api
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:7d}
    session-max-age: ${SESSION_MAX_AGE:30d}
    refresh-reuse-grace: 30s
    max-failed-logins: 5
    lockout-duration: 15m
    cookie:
      name: folio_rt
      path: /api/v1/auth
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: Strict
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    root: INFO
    folio.access: INFO
