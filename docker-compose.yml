# OPTIONAL — for reviewers without a local PostgreSQL. Starts the database only;
# run the API and web app as described in README.md.
#   docker compose up -d
#   DB_URL=jdbc:postgresql://localhost:5433/folio DB_USERNAME=folio DB_PASSWORD=folio ./mvnw spring-boot:run
services:
  postgres:
    image: postgres:16-alpine
    container_name: folio-postgres
    environment:
      POSTGRES_DB: folio
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: folio
    ports:
      - "5433:5432"   # 5433 so it never collides with a locally installed PostgreSQL
    volumes:
      - folio-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folio -d folio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  folio-pgdata:
